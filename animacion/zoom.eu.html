<meta name="description" content="«Vibe coding arduratsua» gidaren animazioa plano bakarrean: IArekiko elkarrizketa baten kurtsorean sartzen den zoom infinitu bat, hamar gomendioak lau mundutan zeharkatzen dituena, bata bestearen barruan.">
<link rel="icon" href="../recursos/logo/favicon.svg" type="image/svg+xml">
<!--
  Segunda animación de la guía (ADR 17): un zoom infinito con tipografía cinética.
  Cinco niveles, cada uno dentro de un objeto del anterior (el cursor, la pantalla de una tableta,
  una tecla y el símbolo de Creative Commons). La cámara es un número z: la parte entera es el nivel
  y la decimal, lo que se ha avanzado hacia el siguiente; cada nivel se escala alrededor del punto
  fijo de su «portal», de modo que la entrada es continua, sin cortes.
  Todo sale del tiempo (ADR 16): render(t) pinta un instante exacto, y grabar.js
  lo convierte en vídeo. La música y los efectos se sintetizan con Web Audio.
  Cada elemento se anima con fotogramas clave en data-k: «t:propiedades|t:propiedades…», con
  o (opacidad), x e y (desplazamiento), s (escala), w (escala horizontal) y r (giro), y la curva
  del tramo (eo, ei, eio, eb con rebote, lin). Los tiempos cuentan desde la llegada al nivel.
  Iconos: Lucide (ISC; los derivados de Feather, MIT). Tipografía: Atkinson Hyperlegible (OFL).
-->
<style>
@font-face { font-family: "Atkinson Hyperlegible"; src: url("../recursos/fuentes/atkinson-hyperlegible-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: "Atkinson Hyperlegible"; src: url("../recursos/fuentes/atkinson-hyperlegible-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }

:root {
  --papel: #fbfbf8; --hoja: #ffffff; --tinta: #16232b; --tinta-suave: #4d5b63; --raya: #dde3df;
  --pizarra: #17453b; --tiza: #f3f1e7; --tiza-suave: #bcd2c9; --verde: #0f766e; --azul: #24508f; --marca: #e7f1ee;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papel: #0f1c19; --hoja: #152722; --tinta: #e9ece6; --tinta-suave: #a9b8b1; --raya: #27413b;
    --verde: #6fcdb9; --azul: #9bbcf2; --marca: #1c362f; }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; --papel: #0f1c19; --hoja: #152722; --tinta: #e9ece6; --tinta-suave: #a9b8b1; --raya: #27413b;
  --verde: #6fcdb9; --azul: #9bbcf2; --marca: #1c362f; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100svh; display: flex; flex-direction: column; background: var(--papel); color: var(--tinta);
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif; line-height: 1.5; }
a { color: var(--verde); text-underline-offset: 0.16em; }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; border-radius: 3px; }

.barra { background: var(--pizarra); color: var(--tiza); }
.barra-int, .pie-int, main { width: 100%; max-width: 64rem; margin-inline: auto; padding-inline: 16px; }
.barra-int { display: flex; align-items: center; gap: 0.6rem; padding-block: 0.5rem; font-size: 0.95rem; }
.barra a { color: var(--tiza); text-decoration: none; display: inline-flex; align-items: center; gap: 0.55rem; font-weight: 700; }
.barra a:hover { text-decoration: underline; }
.barra img { width: 1.6rem; height: 1.6rem; border-radius: 5px; }
.barra span { color: var(--tiza-suave); }
.barra :focus-visible { outline-color: var(--tiza); }
main { flex: 1; display: flex; flex-direction: column; align-items: center; padding-block: 12px; }
h1 { font-size: 1.15rem; margin: 0 0 8px; text-align: center; }
.reproductor { --lado: min(calc(100vw - 32px), calc(100svh - 11.5rem), 62rem); width: var(--lado); }
.marco { position: relative; width: var(--lado); height: var(--lado); overflow: hidden; border-radius: 10px; background: #0b1714;
  box-shadow: 0 1px 2px rgba(22,35,43,.08), 0 8px 24px rgba(22,35,43,.08); }
.empezar { position: absolute; left: 0; right: 0; bottom: 5%; margin-inline: auto; width: max-content; display: flex; align-items: center; gap: 0.5em;
  font: inherit; font-size: clamp(0.85rem, 2.2vw, 1.3rem); font-weight: 700; padding: 0.55em 1.1em 0.55em 0.85em; border-radius: 999px; border: 0; cursor: pointer;
  background: #f5c542; color: #1a1400; box-shadow: 0 6px 20px rgba(0,0,0,.35); z-index: 5; }
.empezar:hover { background: #ffd35c; }
.empezar svg { width: 1.4em; height: 1.4em; }
.empezar[hidden] { display: none; }
.controles { display: flex; align-items: center; gap: 6px; padding-top: 8px; }
.controles button { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; padding: 0; border-radius: 6px;
  border: 1px solid var(--raya); background: var(--hoja); color: var(--tinta); cursor: pointer; }
.controles button:hover { background: var(--marca); }
.controles svg { width: 1.25rem; height: 1.25rem; }
.controles svg [hidden] { display: none; }
.linea { position: relative; flex: 1; min-width: 4rem; height: 2.5rem; display: flex; align-items: center; }
.linea input { width: 100%; margin: 0; accent-color: var(--verde); cursor: pointer; position: relative; z-index: 1; }
.marcas { position: absolute; inset: 0; pointer-events: none; }
.marcas i { position: absolute; top: calc(50% + 0.55rem); width: 2px; height: 0.4rem; background: var(--tinta-suave); opacity: .55; }
.tiempo { flex: none; font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--tinta-suave); min-width: 5.6rem; text-align: center; }
.escena-actual { margin: 4px 0 0; font-size: 0.9rem; color: var(--tinta-suave); text-align: center; min-height: 1.4em; }
@media (max-width: 30rem) { .tiempo { display: none; } }
.pie { font-size: 0.85rem; color: var(--tinta-suave); border-top: 1px solid var(--raya); }
.pie-int { padding-block: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.2rem 1.2rem; }

/* ─── Escenario: 1080 × 1080, escalado al marco ─── */
.escenario { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0b1714;
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif; line-height: 1.15; }
.escenario * { margin: 0; }
.camara { position: absolute; inset: 0; }
.nivel { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
.k { position: absolute; transform-origin: 50% 50%; }
.p { display: inline-block; transform-origin: 50% 70%; }
.pl { white-space: pre-wrap; }
.b { font-weight: 700; }
.num { font-weight: 700; line-height: 0.9; -webkit-text-fill-color: transparent; -webkit-text-stroke: 6px currentColor; letter-spacing: -0.04em; }
.cab { left: 60px; top: 44px; font-size: 24px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.tit { left: 330px; top: 130px; width: 700px; font-size: 62px; font-weight: 700; line-height: 1.1; }
.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pastilla { padding: 10px 22px; border-radius: 999px; font-size: 30px; font-weight: 700; white-space: nowrap; }
.cursor { display: inline-block; width: 40px; height: 40px; vertical-align: -6px; margin-left: 6px; background: #f3f1e7; border-radius: 4px; }
.grano { position: absolute; inset: 0; pointer-events: none; opacity: .07; background-size: 256px 256px; mix-blend-mode: overlay; }
.vineta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.34) 100%); }

/* Modos incrustado y de grabación, como en la primera animación */
.incrustar body { background: var(--hoja); min-height: 0; }
.incrustar .barra, .incrustar h1, .incrustar .escena-actual, .incrustar .pie { display: none !important; }
.incrustar main { padding: 0; }
.incrustar .reproductor { --lado: min(100vw, calc(100vh - 3.3rem)); }
.incrustar .marco { border-radius: 6px; box-shadow: none; }
.grabar .barra, .grabar h1, .grabar .controles, .grabar .escena-actual, .grabar .pie, .grabar .empezar { display: none !important; }
.grabar main { padding: 0; }
.grabar .reproductor { --lado: 1080px; }
.grabar .marco { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<header class="barra">
  <div class="barra-int">
    <a href="../eu/index.html"><img src="../recursos/logo/favicon.svg" alt="">Vibe coding arduratsua</a>

<main>
<h1>Gida zoom infinitu batean</h1>
<div class="reproductor">
  <div class="marco" id="marco">
    <div class="escenario" id="escenario" role="img" aria-label="Vibe coding arduratsua gidari buruzko animazioa, plano bakarrean.">
      <div class="camara" id="camara"></div>

      <div class="vineta"></div>
    </div>
    <button class="empezar" id="empezar-btn" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>Erreproduzitu soinuarekin</button>
  </div>

    <button type="button" id="play" aria-label="Erreproduzitu" title="Erreproduzitu (zuriune-barra)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="i-play" d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/><g class="i-pausa" hidden><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></g><g class="i-otra" hidden><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></g></svg></button>
    <button type="button" id="siguiente" aria-label="Hurrengo zatia" title="Hurrengo zatia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg></button>

  </div>
  <p class="escena-actual" id="escena-actual" aria-live="polite"></p>
</div>

</main>

<footer class="pie">
  <div class="pie-int">
    <span>© 2026 <a href="https://bilateria.org" target="_blank" rel="noopener">Juan José de Haro</a>. Edukia: <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.eu" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</span>
    <span>IArekin sortua (<a href="https://jjdeharo.github.io/miae/?nivel=4" target="_blank" rel="noopener">MIAEren 4. maila</a>): egileak lana zuzendu du eta testuak gidarekin kontrastatu ditu.</span>
  </div>
</footer>

<script>
"use strict";
const parametros = new URLSearchParams(location.search);
const grabando = parametros.has("grabar");
if (grabando) document.documentElement.classList.add("grabar");
if (parametros.has("incrustar")) document.documentElement.classList.add("incrustar");
if (["light", "dark"].includes(parametros.get("tema"))) document.documentElement.dataset.theme = parametros.get("tema");
const $ = id => document.getElementById(id);

// ─── Utilidades de fotogramas clave ───
const r2 = n => Math.round(n * 1000) / 1000;
// Aparecer en t desde un estado («o0 y50») hasta el reposo; salir en t hacia otro estado.
const A = (t, desde = "o0 y50", d = 0.55, e = "eb") => `${r2(t)}:${desde}|${r2(t + d)}:o1 x0 y0 s1 r0 w1 ${e}`;
const S = (t, hacia = "o0 y-40", d = 0.45, e = "ei") => `|${r2(t)}:|${r2(t + d)}:${hacia} ${e}`;
const ICONO = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  escudo: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  nube: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  enlace: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  roto: '<path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/><path d="M8 2v3"/><path d="M2 8h3"/><path d="M16 19v3"/><path d="M19 16h3"/>',
  imagen: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  musica: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  cc: '<circle cx="12" cy="12" r="10"/><path d="M10 9.3a2.8 2.8 0 0 0-3.5 1 3.1 3.1 0 0 0 0 3.4 2.7 2.7 0 0 0 3.5 1"/><path d="M17 9.3a2.8 2.8 0 0 0-3.5 1 3.1 3.1 0 0 0 0 3.4 2.7 2.7 0 0 0 3.5 1"/>',
  libro: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="m9 9.5 2 2 4-4"/>',
};
const svg = (nombre, px, color = "currentColor", grosor = 2) =>
  `<svg class="ic" viewBox="0 0 24 24" width="${px}" height="${px}" style="color:${color};stroke-width:${grosor}" aria-hidden="true">${ICONO[nombre]}</svg>`;

function E(padre, estilo, html, k, son, clase = "") {
  const d = document.createElement("div");
  d.className = ("k " + clase).trim();
  d.style.cssText = estilo;
  d.innerHTML = html;
  if (k) d.dataset.k = k;
  if (son) d.dataset.son = son;
  padre.append(d);
  return d;
}
// Palabras que entran una a una; «salida» (opcional) las retira en cascada.
function palabras(padre, estilo, texto, t0, paso = 0.08, salida = null, desde = "o0 y44", clase = "") {
  const d = E(padre, estilo, "", null, null, clase);
  texto.split(" ").forEach((w, i) => {
    const s = document.createElement("span");
    s.className = "p"; s.textContent = w;
    s.dataset.k = A(t0 + i * paso, desde, 0.5) + (salida != null ? S(salida + i * 0.015, "o0 y-36", 0.35) : "");
    d.append(s, document.createTextNode(" "));
  });
  return d;
}
// Texto que se escribe letra a letra (con cursor opcional al final).
const TECLEO = [];
function escribir(padre, estilo, texto, t0, cps, conCursor = false, k = null) {
  const d = E(padre, estilo, "", k, null, "pl");
  [...texto].forEach((c, i) => {
    const s = document.createElement("span");
    s.textContent = c; s.dataset.t = r2(t0 + i / cps);
    d.append(s); TECLEO.push(s);
  });
  if (conCursor) { const c = document.createElement("span"); c.className = "cursor"; d.append(c); d.cursor = c; }
  d.fin = t0 + texto.length / cps;
  return d;
}

// ─── Los cinco niveles: cada uno vive dentro del «portal» del anterior ───
const camaraEl = $("camara");
const NIVELES = [];
function nivel(llegada, fondo, tinta) {
  const el = document.createElement("div");
  el.className = "nivel"; el.style.background = fondo; el.style.color = tinta;
  camaraEl.append(el);
  const n = { i: NIVELES.length, el, llegada };
  NIVELES.push(n);
  return n.el;
}
// Rótulo grande de fase al llegar, que se encoge en la cabecera del nivel.
function fase(N, numero, verbo, resto, acento, suave) {
  E(N, `left:0;top:350px;width:1080px;text-align:center;font-size:30px;font-weight:700;letter-spacing:.3em;color:${suave}`, `${numero}. FASEA / 4`, A(-1.0, "o0 y-30", 0.5, "eo") + S(1.9, "o0", 0.3));
  E(N, `left:0;top:400px;width:1080px;text-align:center;font-size:170px;font-weight:700;letter-spacing:-.02em`, verbo, A(-0.9, "o0 s0.4", 0.6) + S(2.0, "o0 s1.8", 0.4));
  E(N, `left:0;top:590px;width:1080px;text-align:center;font-size:96px;font-weight:700;color:${acento}`, resto, A(-0.6, "o0 s0.4", 0.6) + S(2.05, "o0 s1.8", 0.4));
  E(N, `color:${suave}`, `${numero} · ${verbo} ${resto}`, A(2.2, "o0 x-40", 0.5, "eo"), null, "cab");
}
// Número gigante hueco y título de una recomendación.
function recomendacion(N, n, titulo, t0, salida, acento, tamano = 400) {
  E(N, `left:${n > 9 ? 20 : 40}px;top:92px;font-size:${tamano}px;color:${acento}`, String(n),
    A(t0, "o0 s2.6 r-12", 0.5) + (salida != null ? S(salida, "o0 x-160 r-10", 0.4) : ""), `golpe@${t0}`, "num");
  palabras(N, n > 9 ? "left:390px;top:130px;width:650px;font-size:60px;font-weight:700;line-height:1.1" : "", titulo, t0 + 0.3, 0.07, salida, "o0 y50", n > 9 ? "" : "tit");
}

// Nivel 0: la conversación con la IA
const TINTA0 = "#f3f1e7", SUAVE0 = "#9fbab0", AMARILLO = "#f5c542";
const N0 = nivel(0, "#0b1714", TINTA0);
const prompt = escribir(N0, `left:80px;top:118px;width:940px;font-size:42px;color:${TINTA0}`, "› sortu uraren zikloaren simulazio bat", 0.6, 15, true, "108.4:|109:o0 y-30 ei");
prompt.cursor.dataset.portal = "rect"; prompt.cursor.dataset.radio = "4";
E(N0, `left:80px;top:395px;font-size:26px;font-weight:700;letter-spacing:.22em;color:${SUAVE0}`, "VIBE CODING HEZITZAILEA", A(3.9, "o0 x-40", 0.5, "eo") + S(9.6, "o0", 0.3));
E(N0, `left:80px;top:440px;font-size:200px;font-weight:700;letter-spacing:-.03em`, "IAk", A(4.1, "o0 s1.8", 0.45) + S(6.7, "o0 x-120", 0.35), "golpe@4.1");
palabras(N0, "left:86px;top:670px;width:900px;font-size:74px;font-weight:700", "kodea idazten du.", 4.6, 0.14, 6.7);
E(N0, `left:80px;top:440px;font-size:160px;font-weight:700;letter-spacing:-.03em`, "Pertsonak", A(7.0, "o0 s1.8", 0.45) + S(9.6, "o0 x-120", 0.35), "golpe@7");

      ruido(ctx, c, E_, cuando, ev.dur - corte, 0.2, "bandpass", 300, 7000, (p, t0, d) => { p.setValueAtTime(0.0001, t0); p.exponentialRampToValueAtTime(0.22, t0 + d); p.linearRampToValueAtTime(0, t0 + d + 0.02); });
      const o = osc(ctx, c, E_, "sine", 180, cuando, ev.dur - corte, (p, t0, d) => { p.setValueAtTime(0, t0); p.linearRampToValueAtTime(0.08, t0 + d); p.linearRampToValueAtTime(0, t0 + d + 0.02); });
      o.frequency.exponentialRampToValueAtTime(1100, cuando + ev.dur - corte); break;
    }
    case "impacto": {
      const o = osc(ctx, c, E_, "sine", 90, cuando, 1.4, percusion(0.9, 1.4)); o.frequency.exponentialRampToValueAtTime(30, cuando + 1);
      ruido(ctx, c, E_, cuando, 1.1, 0.35, "lowpass", 3000, 200); break;
    }
    case "rebobinar": {
      for (const n of [57, 64, 69, 72]) { const o = osc(ctx, c, M, "sawtooth", hz(n), cuando, 3.8, sostenido(0.03, 0.05, 1.5), 1600); o.frequency.exponentialRampToValueAtTime(hz(n) / 8, cuando + 3.6); }
      ruido(ctx, c, E_, cuando, 3.8, 0.18, "bandpass", 6000, 250, sostenido(0.16, 0.2, 0.6)); break;
    }
    case "tecla": ruido(ctx, c, E_, cuando, 0.035, 0.16, "highpass", 2500, 3500); break;
    case "pop": { const o = osc(ctx, c, E_, "sine", 700, cuando, 0.14, percusion(0.12, 0.14)); o.frequency.exponentialRampToValueAtTime(1300, cuando + 0.06); break; }
    case "golpe": {
      const o = osc(ctx, c, E_, "sine", 130, cuando, 0.5, percusion(0.8, 0.5)); o.frequency.exponentialRampToValueAtTime(38, cuando + 0.25);
      ruido(ctx, c, E_, cuando, 0.25, 0.25, "lowpass", 2500, 400); break;
    }
    case "sello": ruido(ctx, c, E_, cuando, 0.16, 0.4, "lowpass", 1400, 500); osc(ctx, c, E_, "sine", 95, cuando, 0.25, percusion(0.5, 0.25)); break;
    case "bloqueo": osc(ctx, c, E_, "square", 98, cuando, 0.2, percusion(0.12, 0.2), 700); ruido(ctx, c, E_, cuando, 0.1, 0.2, "lowpass", 900, 300); break;
    case "rebote": { const o = osc(ctx, c, E_, "triangle", 520, cuando, 0.22, percusion(0.12, 0.22)); o.frequency.exponentialRampToValueAtTime(260, cuando + 0.2); break; }
    case "apagar": { const o = osc(ctx, c, E_, "sine", 900, cuando, 0.9, percusion(0.14, 0.9)); o.frequency.exponentialRampToValueAtTime(90, cuando + 0.8); ruido(ctx, c, E_, cuando, 0.5, 0.15, "bandpass", 2000, 200); break; }
    case "chispa": [84, 88, 91, 96, 100].forEach((n, i) => osc(ctx, c, E_, "triangle", hz(n), cuando + i * 0.045, 0.4, percusion(0.06, 0.4))); break;
    case "blip": osc(ctx, c, E_, "square", hz(ev.nota + 12), cuando, 0.2, percusion(0.07, 0.2), 3000); osc(ctx, c, E_, "sine", hz(ev.nota), cuando, 0.3, percusion(0.1, 0.3)); break;
  }
}
const SOSTENIDOS = new Set(["pad", "bajo", "subida"]);

window.audioWav = async () => {
  const sr = 48000, ctx = new OfflineAudioContext(2, Math.ceil(TOTAL * sr), sr);
  const c = cadena(ctx, ctx.destination);
  for (const ev of EVENTOS) sonar(ctx, c, ev, ev.t);
  const buf = await ctx.startRendering();
  const n = buf.length, datos = new DataView(new ArrayBuffer(44 + n * 4));
  const txt = (o, s) => [...s].forEach((ch, i) => datos.setUint8(o + i, ch.charCodeAt(0)));
  txt(0, "RIFF"); datos.setUint32(4, 36 + n * 4, true); txt(8, "WAVEfmt "); datos.setUint32(16, 16, true);
  datos.setUint16(20, 1, true); datos.setUint16(22, 2, true); datos.setUint32(24, sr, true); datos.setUint32(28, sr * 4, true);
  datos.setUint16(32, 4, true); datos.setUint16(34, 16, true); txt(36, "data"); datos.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0; i < n; i++) { datos.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); datos.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  const bytes = new Uint8Array(datos.buffer); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

// ─── Reproductor (el mismo que en la primera animación) ───
let t = 0, reproduciendo = false, silencio = false;
let actx = null, cad = null, base = 0, siguienteEv = 0, reloj = 0, marcaPerf = 0, programador = 0;
const bPlay = $("play"), bSonido = $("sonido"), rango = $("posicion"), tiempo = $("tiempo"), rotulo = $("escena-actual"), bEmpezar = $("empezar-btn");
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const capituloEn = s => { let k = 0; CAPITULOS.forEach(([c], i) => { if (s >= c - 0.01) k = i; }); return k; };
function ahora() {
  if (!reproduciendo) return t;
  return cad && actx.state === "running" ? actx.currentTime - base : reloj + (performance.now() - marcaPerf) / 1000;
}
function pararSonido() {
  if (!cad) return;
  const c = cad; cad = null;
  c.salida.gain.setTargetAtTime(0, actx.currentTime, 0.03);
  setTimeout(() => { for (const n of c.nodos) { try { n.stop(); } catch (_) {} } c.salida.disconnect(); }, 200);
}
function arrancarSonido() {
  if (!actx) {
    let prestado = null;
    try { if (parametros.has("incrustar") && window.parent !== window) prestado = window.parent.contextoAnimacion; } catch (_) {}
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!prestado && !AC) return;
    actx = prestado || new AC();
    actx.onstatechange = () => {
      if (!reproduciendo || actx.state !== "running") return;
      t = reloj + (performance.now() - marcaPerf) / 1000; reloj = t; marcaPerf = performance.now();
      pararSonido(); arrancarSonido();
    };
  }
  actx.resume();
  const vol = actx.createGain(); vol.gain.value = silencio ? 0 : 1; vol.connect(actx.destination);
  cad = cadena(actx, vol); cad.vol = vol;
  base = actx.currentTime + 0.08 - t;
  for (const ev of EVENTOS) if (SOSTENIDOS.has(ev.tipo) && ev.t < t && ev.t + ev.dur > t + 0.3) sonar(actx, cad, ev, actx.currentTime + 0.08, t - ev.t);
  siguienteEv = EVENTOS.findIndex(ev => ev.t >= t); if (siguienteEv < 0) siguienteEv = EVENTOS.length;
}
function programar() {
  if (!cad) return;
  const limite = ahora() + 0.6;
  while (siguienteEv < EVENTOS.length && EVENTOS[siguienteEv].t < limite) {
    const ev = EVENTOS[siguienteEv++];
    sonar(actx, cad, ev, Math.max(actx.currentTime, base + ev.t));
  }
}
function pintarControles() {
  const fin = t >= TOTAL - 0.01;
  bPlay.querySelector(".i-play").toggleAttribute("hidden", reproduciendo || fin);
  bPlay.querySelector(".i-pausa").toggleAttribute("hidden", !reproduciendo);
  bPlay.querySelector(".i-otra").toggleAttribute("hidden", reproduciendo || !fin);
  const et = reproduciendo ? "Pausatu" : fin ? "Berriro hasi" : "Erreproduzitu";
  bPlay.setAttribute("aria-label", et); bPlay.title = et + " (zuriune-barra)";
  rango.value = Math.round(t / TOTAL * 1000);
  const cap = CAPITULOS[capituloEn(t)][1];
  rango.setAttribute("aria-valuetext", `${mmss(t)} / ${mmss(TOTAL)}, ${cap}`);
  tiempo.textContent = `${mmss(t)} / ${mmss(TOTAL)}`;
  const tit = `${capituloEn(t) + 1} / ${CAPITULOS.length}: ${cap}`;
  if (rotulo.textContent !== tit) rotulo.textContent = tit;
}
function bucle() {
  if (!reproduciendo) return;
  t = Math.min(TOTAL, ahora());
  render(t); pintarControles();
  if (t >= TOTAL) { pausar(); return; }
  requestAnimationFrame(bucle);
}
function reproducir() {
  if (t >= TOTAL - 0.01) t = 0;
  bEmpezar.hidden = true;
  reproduciendo = true; reloj = t; marcaPerf = performance.now();
  arrancarSonido();
  clearInterval(programador); programador = setInterval(programar, 100); programar();
  requestAnimationFrame(bucle);
}
function pausar() {
  t = Math.min(TOTAL, ahora()); reproduciendo = false;
  clearInterval(programador); pararSonido();
  render(t); pintarControles();
}
function irA(s) {
  const seguia = reproduciendo;
  if (seguia) pausar();
  t = Math.max(0, Math.min(TOTAL, s));
  bEmpezar.hidden = true;
  render(t); pintarControles();
  if (seguia) reproducir();
}
// En pausa, saltar a una parte la muestra ya compuesta (tras el rótulo de la fase).
const irACapitulo = i => { i = Math.max(0, Math.min(CAPITULOS.length - 1, i)); irA(CAPITULOS[i][0] + (reproduciendo ? 0 : i === 5 ? 14 : 3)); };
bPlay.addEventListener("click", () => reproduciendo ? pausar() : reproducir());
bEmpezar.addEventListener("click", reproducir);
$("anterior").addEventListener("click", () => { const k = capituloEn(t); irACapitulo(t - CAPITULOS[k][0] > 1.5 && reproduciendo ? k : k - 1); });
$("siguiente").addEventListener("click", () => irACapitulo(capituloEn(t) + 1));
rango.addEventListener("input", () => irA(rango.value / 1000 * TOTAL));
bSonido.addEventListener("click", () => {
  silencio = !silencio;
  if (cad) cad.vol.gain.setTargetAtTime(silencio ? 0 : 1, actx.currentTime, 0.03);
  bSonido.setAttribute("aria-pressed", silencio);
  bSonido.querySelector(".i-con").toggleAttribute("hidden", silencio);
  bSonido.querySelector(".i-sin").toggleAttribute("hidden", !silencio);
  const et = silencio ? "Soinua aktibatu" : "Isilarazi"; bSonido.setAttribute("aria-label", et); bSonido.title = et;
});
document.addEventListener("keydown", ev => {
  if (ev.key === " " && !ev.target.closest("button, summary, a, input")) { ev.preventDefault(); reproduciendo ? pausar() : reproducir(); }
});
if (parametros.has("incrustar")) document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  try { const v = window.frameElement && window.frameElement.closest("dialog"); if (v) v.close(); } catch (_) {}
});
document.addEventListener("visibilitychange", () => { if (document.hidden && reproduciendo) pausar(); });
$("marcas").innerHTML = CAPITULOS.slice(1).map(([c]) => `<i style="left:calc(${(c / TOTAL * 100).toFixed(2)}% - 1px)"></i>`).join("");

const marco = $("marco"), escenario = $("escenario");
function escalar() { escenario.style.transform = `scale(${marco.clientWidth / 1080})`; }
new ResizeObserver(escalar).observe(marco); escalar();
document.fonts.ready.then(() => { medir(); PUNTOS = puntosCamara(); render(reproduciendo ? t : CARTEL); });
if (parametros.has("auto")) document.fonts.ready.then(reproducir);

window.fijar = s => { t = s; render(s); };
window.DURACION = TOTAL;
// Antes de reproducir, el escenario muestra el título final como cartel; la posición sigue en 0.
const CARTEL = grabando ? 0 : 117;
render(CARTEL); pintarControles();
</script>
