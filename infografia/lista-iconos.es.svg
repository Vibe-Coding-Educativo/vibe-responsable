<rect x="0" y="0" width="1080" height="330" fill="#17453b"/>
<text x="70" y="125" font-size="68" font-weight="700" fill="#ffffff">Antes de publicar:</text>
<text x="70" y="205" font-size="68" font-weight="700" fill="#ffffff">diez recomendaciones</text>
<text x="70" y="272" font-size="34" font-weight="400" fill="#bcd2c9">Vibe coding responsable · Materiales educativos</text>
<text x="72" y="392" font-size="24" font-weight="700" letter-spacing="2.5" fill="#0f766e">PROTEGER AL ALUMNADO</text>
