<text x="128" y="622" font-size="58" font-weight="700" fill="#0f766e" text-anchor="middle">2</text>
<rect x="186" y="562" width="80" height="80" rx="18" fill="#0f766e"/>
<g transform="translate(198 574) scale(2.3333)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></g>
<text x="296" y="594" font-size="33" font-weight="400" fill="#16232b">No enviar datos personales</text>
<text x="296" y="636" font-size="33" font-weight="400" fill="#16232b">a servicios ajenos al centro</text>
<text x="72" y="716" font-size="24" font-weight="700" letter-spacing="2.5" fill="#0f766e">CONSTRUIR EL MATERIAL</text>
