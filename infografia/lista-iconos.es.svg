<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2112" width="1080" height="2112" font-family="'Atkinson Hyperlegible', Inter, Arial, sans-serif" role="img" aria-labelledby="t d" lang="es">
<title id="t">Antes de publicar: diez recomendaciones</title>
<desc id="d">Infografía con las diez recomendaciones para publicar de forma responsable materiales educativos creados con vibe coding, agrupadas en cuatro fases: proteger al alumnado, construir el material, documentar el trabajo y compartir el material.</desc>
